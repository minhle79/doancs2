<header class="navbar">
  <div class="container nav-inner">
    <a href="/" class="logo">Computer<span>Store</span></a>
    <form class="nav-search" method="get" action="/">
      <input type="text" name="q" placeholder="Tìm kiếm..." value="{{ q|default:'' }}" />
      <button class="btn">Tìm</button>
    </form>
    <nav class="nav-links">
      {% if request.user.is_authenticated %}
        <span>Xin chào, {{ request.user.username }}</span>
        <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}
          <button class="btn" type="submit">Đăng xuất</button>
        </form>
      {% else %}
        <a class="btn" href="{% url 'login' %}">Đăng nhập</a>
        <a class="btn" href="{% url 'signup' %}">Đăng ký</a>
      {% endif %}
      <a class="btn primary" href="{% url 'cart_detail' %}">Giỏ hàng</a>
    </nav>
  </div>
</header>
