<header class="navbar">
  <div class="container nav-inner">
    <a href="/" class="logo">💻 ComputerStore</a>
    <form class="nav-search" method="get" action="{% url 'products' %}">
      <input id="search-input" type="text" name="q" autocomplete="off" placeholder="🔍 Tìm kiếm sản phẩm..." value="{{ q|default:'' }}" />
      <div id="search-suggest" class="suggest"></div>
    </form>
    <nav class="nav-links">
      <a class="btn" href="/">🏠 Trang chủ</a>
      <a class="btn" href="{% url 'products' %}">📦 Sản phẩm</a>
      <div class="nav-categories dropdown">
        <a class="btn" href="{% url 'products' %}">📂 Danh mục ▾</a>
        <div class="dropdown-menu">
          {% for c in nav_categories %}
            <a href="{% url 'products' %}?category={{ c.slug }}">{{ c.name }}</a>
          {% endfor %}
        </div>
      </div>
      <button id="openCart" class="btn primary" type="button">
        🛒 Giỏ hàng
        {% if cart_count > 0 %}<span class="badge">{{ cart_count }}</span>{% endif %}
      </button>
      {% if request.user.is_authenticated %}
        <span style="color: var(--muted);">👋 {{ request.user.username }}</span>
        <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}
          <button class="btn danger" type="submit">🚪 Đăng xuất</button>
        </form>
      {% else %}
        <a class="btn" href="{% url 'login' %}">🔐 Đăng nhập</a>
        <a class="btn success" href="{% url 'signup' %}">✨ Đăng ký</a>
      {% endif %}
    </nav>
  </div>
</header>
<div id="cartModal" class="modal hidden"></div>
