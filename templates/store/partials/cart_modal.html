<div class="modal-content">
  <div class="modal-header">
    <h3>Giỏ hàng</h3>
    <button id="closeCart" class="btn">×</button>
  </div>
  <div class="modal-body">
    {% for item in cart %}
    <div class="cart-row">
      <div class="cart-thumb">
        {% if item.product.image %}
        <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}">
        {% endif %}
      </div>
      <div class="cart-info">
        <a href="{% url 'product_detail' item.product.slug %}">{{ item.product.name }}</a>
        <div>{{ item.price }} ₫ × {{ item.quantity }}</div>
      </div>
      <div class="cart-actions">
        <form method="post" action="{% url 'cart_remove' item.product.id %}">
          {% csrf_token %}
          <button class="btn danger" type="submit">🗑</button>
        </form>
      </div>
    </div>
    {% empty %}
    <p>Giỏ hàng trống.</p>
    {% endfor %}
  </div>
  <div class="modal-footer">
    <div class="grow"></div>
    <strong>Tổng:</strong> {{ cart.total_amount }} ₫
    <a href="{% url 'checkout' %}" class="btn primary">Thanh toán</a>
  </div>
</div>
